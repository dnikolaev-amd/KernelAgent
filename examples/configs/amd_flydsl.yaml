# AMD + FlyDSL config for MI300X.
#
# The starting kernel must be FlyDSL. kernel_language keeps later rounds in
# FlyDSL instead of Triton.
#
# Usage:
#   python examples/run_opt_manager.py \
#       --kernel-dir examples/optimize_01_matvec_flydsl \
#       --strategy amd_flydsl
#   python examples/run_opt_manager.py \
#       --kernel-dir examples/optimize_02_rmsnorm_flydsl \
#       --strategy amd_flydsl

strategy: beam_search
num_workers: 4
strategy_config:
  num_top_kernels: 2
  num_bottlenecks: 2
openai_model: gpt-5
high_reasoning_effort: true

benchmark_warmup: 25
benchmark_repeat: 100
divergence_threshold: 50.0
target_platform: rocm
kernel_language: flydsl
gpu_name: "AMD Instinct MI300X"

# platform_kwargs:
#   rocprof_bin_path: /opt/rocm/bin/rocprofv3

platform:
  verifier: rocm
  benchmarker: rocm
  worker_runner: rocm
  specs_provider: rocm
  profiler: rocm
  roofline_analyzer: rocm
  bottleneck_analyzer: rocm
  rag_prescriber: rocm

templates:
  kernel_optimization: triton_kernel_agent/templates/kernel_optimization.j2
  reflexion_prompt: triton_kernel_agent/templates/reflexion_prompt.j2
  triton_guidelines: triton_kernel_agent/templates/flydsl_guidelines.j2
